description: S&P Global is a financial data and ratings publisher whose API surfaces (Market Intelligence,
  Ratings, Commodity Insights, Mobility) are licensed under enterprise agreements. No public per-call
  prices, plan tiers, or self-serve sign-up surface exists; access requires a licensed subscription, often
  with seat counts, feed types, and entitlement scopes negotiated per contract.
sources:
  - https://www.spglobal.com/
  - https://www.spglobal.com/marketintelligence/
notes: S&P Global does not publish API pricing publicly. Marketplace and product pages return 403 to scraping
  and consistently route to "Contact Us" for commercial terms. Tier definitions, per-call prices, and
  quotas are determined per contract and per business line (Market Intelligence, Ratings, Commodity Insights,
  Mobility, Indices). This artifact is intentionally a single Contact Sales plan.
plans:
  - id: s-and-p-global-contact-sales
    name: Contact Sales
    type: enterprise
    description: Enterprise-licensed access to S&P Global data products and APIs. Pricing and entitlements
      are negotiated per business line and per use case.
    entries:
      - label: Licensed API Access
        name: licensed_access
        type: flat
        metric: varies
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: S&P Capital IQ Pro / Market Intelligence
      - name: S&P Global Ratings APIs
      - name: S&P Global Commodity Insights (Platts) data feeds
      - name: S&P Global Mobility data
      - name: S&P Dow Jones Indices
      - name: Entitlements managed via license / seat / feed contract
