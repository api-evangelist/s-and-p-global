aid: s-and-p-global
name: S&P Global
description: >-
  S&P Global is a leading provider of credit ratings, benchmarks, analytics, and workflow solutions in the global
  capital, commodity, and automotive markets. Through its divisions — S&P Global Market Intelligence, S&P Global
  Ratings, S&P Global Commodity Insights, S&P Global Mobility, and S&P Dow Jones Indices — the company delivers data,
  analytics, and decisioning capabilities to financial institutions, corporations, governments, and individuals
  worldwide. S&P Global APIs enable programmatic access to financial data, market prices, energy market data, credit
  ratings, and geospatial intelligence.
