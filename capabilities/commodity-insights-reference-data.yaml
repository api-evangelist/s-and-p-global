naftiko: 1.0.0-alpha2
info:
  label: S&P Global Commodity Insights API — Reference Data
  description: 'S&P Global Commodity Insights API — Reference Data. 1 operations. Lead operation: List Market Data Symbols.
    Self-contained Naftiko capability covering one S And P Global business surface.'
  tags:
  - S And P Global
  - Reference Data
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    S_AND_P_GLOBAL_API_KEY: S_AND_P_GLOBAL_API_KEY
capability:
  consumes:
  - type: http
    namespace: commodity-insights-reference-data
    baseUri: https://api.platts.com
    description: S&P Global Commodity Insights API — Reference Data business capability. Self-contained, no shared references.
    resources:
    - name: market-data-v1-symbols
      path: /market-data/v1/symbols
      operations:
      - name: listsymbols
        method: GET
        description: List Market Data Symbols
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: commodityName
          in: query
          type: string
          description: Filter by commodity name (e.g., Crude Oil, Natural Gas)
        - name: assessmentFrequency
          in: query
          type: string
          description: Filter by assessment frequency
        - name: pageSize
          in: query
          type: integer
          description: Number of records per page (max 1000)
        - name: page
          in: query
          type: integer
          description: Page number for pagination
    authentication:
      type: bearer
      token: '{{env.S_AND_P_GLOBAL_API_KEY}}'
  exposes:
  - type: rest
    namespace: commodity-insights-reference-data-rest
    port: 8080
    description: REST adapter for S&P Global Commodity Insights API — Reference Data. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/market-data/v1/symbols
      name: market-data-v1-symbols
      description: REST surface for market-data-v1-symbols.
      operations:
      - method: GET
        name: listsymbols
        description: List Market Data Symbols
        call: commodity-insights-reference-data.listsymbols
        with:
          commodityName: rest.commodityName
          assessmentFrequency: rest.assessmentFrequency
          pageSize: rest.pageSize
          page: rest.page
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: commodity-insights-reference-data-mcp
    port: 9090
    transport: http
    description: MCP adapter for S&P Global Commodity Insights API — Reference Data. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: list-market-data-symbols
      description: List Market Data Symbols
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: commodity-insights-reference-data.listsymbols
      with:
        commodityName: tools.commodityName
        assessmentFrequency: tools.assessmentFrequency
        pageSize: tools.pageSize
        page: tools.page
      outputParameters:
      - type: object
        mapping: $.
