principles:
  - name: Visibility
    description: Visibility comes from S&P Global's contracted customer portals and entitlement reports;
      consumers should pull seat / feed usage from the relevant product portal (Capital IQ Pro, Platts
      Connect, etc.) rather than expect a unified usage API.
  - name: Allocation
    description: Allocate by business unit and use-case bound to the license; capture which desks, products,
      or research workflows consume which feeds, since licenses are contractually scoped.
  - name: Optimization
    description: Right-size seats, retire unused feeds at renewal, consolidate overlapping product subscriptions
      across business units, and monitor contract auto-escalators.
  - name: Accountability
    description: Procurement and the data office jointly own renewal and entitlement audits. Establish
      a recurring license review at least quarterly given high contract value.
