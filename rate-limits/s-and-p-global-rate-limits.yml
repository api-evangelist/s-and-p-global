provider: S&P Global
providerId: s-and-p-global
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Financial Data
  - Capital Markets
  - B2B
  - Rate Limiting
description: S&P Global does not publish API rate limits in any public developer or pricing surface. Limits
  are imposed per-license, per-product, and per-feed and are documented inside the entitled developer
  portal that follows contract signing. This artifact is intentionally a Contact Sales placeholder.
sources:
  - https://www.spglobal.com/
notes: Public docs do not expose throttle numbers. Per-product portals (Market Intelligence, Ratings,
  Commodity Insights) document their own throttles to entitled customers only.
limits:
  - name: Licensed API throttling
    scope: account
    metric: varies
    limit: contact sales / per-license
    notes: S&P Global enforces per-product, per-license throttles. Numeric values are released via the
      entitled customer developer portal, not publicly.
policies:
  - name: Per-license entitlement
    description: Throttles, daily caps, and concurrent connections are bound to the executed license and
      change between Market Intelligence, Ratings, Commodity Insights, and Indices products.
  - name: Contact Sales / Account team
    description: Production limits and burst behavior are confirmed by the assigned S&P Global account
      team; clients should not assume defaults.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
